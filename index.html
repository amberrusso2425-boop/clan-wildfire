<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clan Wildfire</title>
<meta name="theme-color" content="#120d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clan Wildfire">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
html,body{margin:0;background:#120d1a;color:#f3e6cf;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
.cw-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.cw-splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 0 30px rgba(242,164,58,.35)}
.cw-splash h1{font-size:26px;color:#ffcf5a;margin:16px 0 6px}
.cw-splash p{color:#e6d6bb;margin:4px 0;max-width:320px;line-height:1.45}
#cwRetry{display:none;margin:18px auto 0;padding:14px 26px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffcf5a,#f2a43a);color:#2a1606;font-size:17px;font-weight:800}
</style>
</head>
<body>
<div class="cw-splash"><img src="icon-180.png" alt=""><h1>Clan Wildfire</h1><p id="cwMsg">Opening Clan Wildfire...</p><button id="cwRetry" type="button">Try again</button></div>
<noscript><p style="text-align:center">Clan Wildfire needs JavaScript turned on.</p></noscript>
<script src="loader.js"></script>
</body>
</html>
